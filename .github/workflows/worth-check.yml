name: WORTH server checks

on:
  push:
    branches: [worth-server]
    paths:
      - "worth/**"
      - ".github/workflows/worth-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install server dependencies
        working-directory: worth
        run: npm install --ignore-scripts
      - name: Check server JavaScript syntax
        working-directory: worth
        run: node --check src/index.js
      - name: Check deploy configuration
        run: test -s worth/render.yaml && test -s worth/package.json
